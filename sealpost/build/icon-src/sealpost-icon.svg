<!-- Sealpost app icon (1.3.1): a harbor seal peeking over a sealed envelope.
     Original artwork. Rendered to PNG/ICO by build/icon-src/render-icon.js -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1d3346"/>
      <stop offset="1" stop-color="#0c1820"/>
    </linearGradient>
    <radialGradient id="fur" cx="0.42" cy="0.35" r="0.75">
      <stop offset="0" stop-color="#b9c6d3"/>
      <stop offset="0.6" stop-color="#8d9fb2"/>
      <stop offset="1" stop-color="#6c7f93"/>
    </radialGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#dfe4ea"/>
    </linearGradient>
    <radialGradient id="wax" cx="0.4" cy="0.35" r="0.7">
      <stop offset="0" stop-color="#5fe3a9"/>
      <stop offset="1" stop-color="#25a873"/>
    </radialGradient>
    <clipPath id="tileClip"><rect x="40" y="40" width="944" height="944" rx="210"/></clipPath>
  </defs>

  <!-- background tile -->
  <rect x="40" y="40" width="944" height="944" rx="210" fill="url(#tile)"/>
  <g clip-path="url(#tileClip)">
    <!-- a little sea at the bottom -->
    <path d="M40 880 Q 200 845 360 880 T 680 880 T 1000 880 V 1000 H 40 Z" fill="#163d52" opacity="0.9"/>
  </g>

  <!-- seal head, peeking from behind the envelope -->
  <g transform="translate(512 470) scale(1.06) translate(-512 -515)">
    <ellipse cx="512" cy="455" rx="232" ry="215" fill="url(#fur)"/>
    <!-- spots -->
    <circle cx="378" cy="370" r="14" fill="#6f8296" opacity="0.6"/>
    <circle cx="640" cy="335" r="11" fill="#6f8296" opacity="0.6"/>
    <circle cx="668" cy="395" r="8" fill="#6f8296" opacity="0.6"/>
    <!-- eyes -->
    <ellipse cx="430" cy="430" rx="42" ry="48" fill="#141b24"/>
    <ellipse cx="594" cy="430" rx="42" ry="48" fill="#141b24"/>
    <circle cx="444" cy="412" r="14" fill="#ffffff"/>
    <circle cx="608" cy="412" r="14" fill="#ffffff"/>
    <circle cx="420" cy="448" r="6" fill="#ffffff" opacity="0.7"/>
    <circle cx="584" cy="448" r="6" fill="#ffffff" opacity="0.7"/>
    <!-- muzzle -->
    <ellipse cx="482" cy="530" rx="58" ry="44" fill="#d6dee7"/>
    <ellipse cx="542" cy="530" rx="58" ry="44" fill="#d6dee7"/>
    <!-- nose -->
    <path d="M488 492 Q512 480 536 492 Q536 516 512 524 Q488 516 488 492 Z" fill="#141b24"/>
    <!-- whisker dots -->
    <g fill="#8a99a8">
      <circle cx="458" cy="525" r="5"/><circle cx="476" cy="543" r="5"/><circle cx="452" cy="550" r="5"/>
      <circle cx="566" cy="525" r="5"/><circle cx="548" cy="543" r="5"/><circle cx="572" cy="550" r="5"/>
    </g>
    <!-- whiskers -->
    <g stroke="#e9eef3" stroke-width="5" stroke-linecap="round" fill="none" opacity="0.85">
      <path d="M440 532 Q380 520 330 528"/><path d="M440 548 Q385 552 336 570"/>
      <path d="M584 532 Q644 520 694 528"/><path d="M584 548 Q639 552 688 570"/>
    </g>
    <!-- smile -->
    <path d="M492 556 Q512 572 532 556" stroke="#5b6c7d" stroke-width="7" fill="none" stroke-linecap="round"/>
    <!-- cheeks -->
    <ellipse cx="380" cy="505" rx="30" ry="18" fill="#f2a7b5" opacity="0.45"/>
    <ellipse cx="644" cy="505" rx="30" ry="18" fill="#f2a7b5" opacity="0.45"/>
  </g>

  <!-- envelope -->
  <g>
    <rect x="160" y="560" width="704" height="330" rx="48" fill="url(#paper)"/>
    <path d="M190 590 L512 770 L834 590" stroke="#a7b2bf" stroke-width="30" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- flippers draped over the envelope edge -->
  <path d="M300 560 C 300 520, 360 515, 380 545 C 395 570, 370 610, 330 612 C 300 612, 290 590, 300 560 Z" fill="#8193a6"/>
  <path d="M724 560 C 724 520, 664 515, 644 545 C 629 570, 654 610, 694 612 C 724 612, 734 590, 724 560 Z" fill="#8193a6"/>
  <g stroke="#6a7c8f" stroke-width="5" stroke-linecap="round">
    <path d="M318 585 L322 604"/><path d="M340 588 L342 608"/><path d="M706 585 L702 604"/><path d="M684 588 L682 608"/>
  </g>

  <!-- the "seal": green wax seal with a padlock -->
  <g>
    <circle cx="512" cy="770" r="112" fill="#0e1a22" opacity="0.25"/>
    <circle cx="512" cy="762" r="104" fill="url(#wax)"/>
    <circle cx="512" cy="762" r="84" fill="none" stroke="#1d8d5f" stroke-width="6" opacity="0.7"/>
    <rect x="462" y="752" width="100" height="74" rx="14" fill="#06281a"/>
    <path d="M478 754 V730 A34 34 0 0 1 546 730 V754" stroke="#06281a" stroke-width="16" fill="none"/>
    <circle cx="512" cy="784" r="11" fill="#5fe3a9"/>
    <rect x="507" y="788" width="10" height="20" rx="4" fill="#5fe3a9"/>
  </g>
</svg>
